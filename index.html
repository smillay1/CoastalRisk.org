<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Millay</title>
<meta name="description" content="Sam Millay: software for the ocean. Lyonesse, Leif, CoastalRisk, and research in remote sensing and fluid simulation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7FAFA;
    --shoal: #CCE3EC;
    --contour: #8AAFC0;
    --ink: #16232D;
    --muted: #55656F;
    --magenta: #A3206E;
    --wide: 72rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Spectral", Georgia, serif;
    font-size: 1.0625rem;
    line-height: 1.5;
  }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; }
  img, video { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Compact header over a faint depth chart */
  .top {
    position: relative;
    overflow: hidden;
    padding: 5rem 0 3rem;
    border-bottom: 1px solid var(--contour);
  }
  .chart { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }
  .chart .shoal { fill: var(--shoal); fill-rule: evenodd; }
  .chart path:not(.shoal) { fill: none; stroke: var(--contour); }
  .chart .c-shallow { stroke-width: 1.4; }
  .chart .c-mid { stroke-width: 0.9; }
  .chart .c-deep { stroke-width: 0.6; stroke-dasharray: 6 5; }
  .chart .soundings { display: none; }
  .top-inner { position: relative; max-width: var(--wide); margin: 0 auto; padding: 0 1.5rem; }
  h1 {
    margin: 0;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.75rem, 8vw, 5.5rem);
    line-height: 1;
    letter-spacing: 0.06em;
  }
  .tag { margin: 1rem 0 0; font-size: 1.2rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
  .links a { color: var(--magenta); text-underline-offset: 0.18em; }

  main { max-width: var(--wide); margin: 0 auto; padding: 3.5rem 1.5rem 1rem; }
  h2 { margin: 0 0 1.25rem; font-weight: 400; font-style: italic; font-size: 1.6rem; letter-spacing: 0.03em; }
  section + section { margin-top: 4.5rem; }

  /* Work grid: the first project spans the full width */
  .work { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.5rem 1.75rem; }
  .work .lead { grid-column: 1 / -1; }
  .shot { margin: 0; }
  .frame {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--shoal);
    border: 1px solid var(--contour);
    overflow: hidden;
  }
  .lead .frame { aspect-ratio: 21 / 9; }
  .frame.dark { background: #0B1116; }
  .frame.contain { background: #EEEFF0; }
  .frame.contain img { object-fit: contain; padding: 1.25rem; }
  .frame.white { background: #fff; }
  .frame.white img { padding: 0.75rem; }
  .project + .project, .project + .pair { margin-top: 4rem; }
  .work .wide2 { grid-column: span 1; }
  @media (min-width: 701px) {
    .project .work:has(.wide2) { grid-template-columns: 2fr 1fr; }
    .project .work:has(.wide2) .frame { aspect-ratio: auto; height: 26rem; }
  }
  .caption {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    margin: 0.75rem 0 0;
  }
  .project .work { gap: 1rem; }
  a.name { color: var(--magenta); text-underline-offset: 0.18em; }
  a.frame-link { display: block; text-decoration: none; }
  a.frame-link:hover .frame { border-color: var(--ink); }
  .shot figcaption {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    margin-top: 0.6rem;
  }
  .name { font-weight: 600; }
  .what { color: var(--muted); font-style: italic; }
  .year { color: var(--muted); font-variant-numeric: oldstyle-nums; white-space: nowrap; }


  footer {
    max-width: var(--wide); margin: 4rem auto 0; padding: 2rem 1.5rem 3.5rem;
    border-top: 1px solid var(--contour); color: var(--muted);
  }

  @media (max-width: 700px) {
    .top { padding-top: 3.5rem; }
    .work { grid-template-columns: 1fr; }
    .lead .frame { aspect-ratio: 16 / 10; }
  }
</style>
</head>
